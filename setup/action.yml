name: "Setup Resumake (rsmk)"
description: "Install the rsmk CLI compiler"
inputs:
  version:
    description: "Version of rsmk to install (e.g. 0.1.0, latest)"
    required: false
    default: "latest"
runs:
  using: "composite"
  steps:
    - name: Install rsmk
      shell: bash
      env:
        RESUMAKE_VERSION: "${{ inputs.version }}"
      run: |
        BASE="https://github.com/arvinduh/resumake/releases"
        if [ "$RESUMAKE_VERSION" = "latest" ] || \
           [ -z "$RESUMAKE_VERSION" ]; then
          INSTALL_URL="${BASE}/latest/download/rsmk-installer.sh"
        else
          TAG="${RESUMAKE_VERSION#v}"
          INSTALL_URL="${BASE}/download/${TAG}/rsmk-installer.sh"
        fi
        curl --proto '=https' --tlsv1.2 -LsSf "$INSTALL_URL" | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
