name: "Setup Resumake (rsmk)"
description: "Install the rsmk CLI compiler and Typst engine"
inputs:
  version:
    description: "Version of rsmk to install (e.g. 0.1.1, latest)"
    required: false
    default: "latest"
runs:
  using: "composite"
  steps:
    - name: Setup Typst compiler
      uses: typst-community/setup-typst@v5
    - name: Install rsmk
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/arvinduh/resumake/main/install.sh | RESUMAKE_VERSION="${{ inputs.version }}" sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
