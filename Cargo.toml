[package]
name = "resumake"
version = "0.5.0"
edition = "2021"

authors = ["Resumake Authors"]
description = "Modular, golden-ratio résumé compiler and layout telemetry engine."
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvinduh/resumake"
keywords = ["resume", "typst", "compiler", "telemetry", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rsmk"
path = "src/main.rs"
required-features = ["cli"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false


[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1.2"
jsonschema = "0.51"
semver = "1.0"
colored = { version = "3.0", optional = true }
comfy-table = { version = "8.0", features = [
  "custom_styling",
], optional = true }
sha2 = "0.11"
include_dir = "0.7"
thiserror = "2.0"
axoupdater = { version = "0.9", features = ["blocking"], optional = true }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-kit = { version = "0.15", default-features = false, features = [
  "scan-fonts",
  "embedded-fonts",
] }

[features]
default = ["cli", "update"]
cli = ["dep:clap", "dep:colored", "dep:comfy-table"]
update = ["cli", "dep:axoupdater"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"
single_component_path_imports = "allow"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
redundant_clone = "warn"


[dev-dependencies]
tempfile = "3.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
