[package]
name = "resumake"
version = "0.2.0"
edition = "2021"
authors = ["Resumake Authors"]
description = "Modular, golden-ratio résumé compiler and layout telemetry engine."
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvinduh/resumake"
keywords = ["resume", "typst", "compiler", "telemetry", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rsmk"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1.2"
jsonschema = "0.51"
semver = "1.0"
which = "8.0"
colored = "3.0"
comfy-table = { version = "8.0", features = ["custom_styling"] }
sha2 = "0.11"
similar = "3.2"
include_dir = "0.7"
thiserror = "2.0"
anyhow = "1.0"
axoupdater = { version = "0.9", features = ["blocking"] }
gix = { version = "0.87", default-features = false, features = [
  "revision",
  "sha1",
  "status",
] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
typst = "0.13"
typst-pdf = "0.13"
typst-syntax = "0.13"
typst-kit = { version = "0.13", features = ["embed-fonts"] }


[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.16"
