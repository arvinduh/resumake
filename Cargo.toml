[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.1"
authors = ["Resumake Authors"]
license = "MIT"
repository = "https://github.com/arvinduh/resumake"

[workspace.dependencies]
resumake = { package = "resumake", path = "crates/resumake" }

[package]
name = "rsmk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance native CLI for compiling and verifying résumés with strict layout telemetry."
readme = "README.md"
keywords = ["resume", "typst", "compiler", "telemetry", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rsmk"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Config for 'dist'
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
install-path = ["~/.local/bin", "~/.cargo/bin"]
install-updater = false
allow-dirty = ["ci"]

[dependencies]
axoupdater = { version = "0.10.2", default-features = false, features = [
  "blocking",
  "github_releases",
] }
clap = { version = "4.5.31", features = ["derive", "string"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"
resumake.workspace = true
serde_json = "1.0.140"
thiserror = "2.0.12"

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Imports
wildcard_imports = "deny"
single_component_path_imports = "allow" # `use some_crate;` manifests
# Hygiene
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
missing_docs_in_private_items = "warn"
# Google: expect over unwrap, and assert messages
unwrap_used = "warn"
missing_assert_message = "warn"
# process::exit only in main; suppress with expect + reason, never allow
exit = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Performance (nursery, outside pedantic)
redundant_clone = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# dist builds release artifacts with this profile.
[profile.dist]
inherits = "release"
