[package]
name = "resumake"
version = "0.2.0"
edition = "2021"
authors = ["Resumake Authors"]
description = "Modular, golden-ratio résumé compiler and layout telemetry engine."
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvinduh/resumake"
keywords = ["resume", "typst", "compiler", "telemetry", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rsmk"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1.2"
jsonschema = "0.51"
which = "8.0"
colored = "3.0"
comfy-table = { version = "8.0", features = ["custom_styling"] }
sha2 = "0.11"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.16"
