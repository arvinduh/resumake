[package]
name = "resumake"
version = "0.1.0"
edition = "2021"
authors = ["Resumake Authors"]
description = "Modular, golden-ratio résumé compiler and layout telemetry engine."
license = "MIT"
readme = "README.md"
keywords = ["resume", "typst", "compiler", "telemetry", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "0.8"
jsonschema = "0.29"
which = "7.0"
colored = "3.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.16"
