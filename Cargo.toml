[package]
name = "resumake"
version = "0.3.2"
edition = "2021"

authors = ["Resumake Authors"]
description = "Modular, golden-ratio résumé compiler and layout telemetry engine."
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvinduh/resumake"
keywords = ["resume", "typst", "compiler", "telemetry", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rsmk"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.wix]
upgrade-guid = "B5779AC4-341E-4BB0-9D71-D5DFCD8F8210"
path-guid = "FA9E6B13-0C65-47C0-AAD7-FB0B8AC90A64"
license = false
eula = false

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false


[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1.2"
jsonschema = "0.52"
semver = "1.0"
colored = "3.0"
comfy-table = { version = "8.0", features = ["custom_styling"] }
sha2 = "0.11"
similar = "3.2"
include_dir = "0.7"
thiserror = "2.0"
axoupdater = { version = "0.10", features = ["blocking"] }
tokio = { version = "1", default-features = false, features = ["rt", "net"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
typst = "0.15"
typst-pdf = "0.15"
typst-syntax = "0.15"
typst-kit = { version = "0.14", features = ["embed-fonts"] }


[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
