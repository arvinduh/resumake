name: Release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: arvinduh/resumake/setup@v1
        with:
          version: "RSMK_VERSION"
      - run: rsmk build
      - uses: softprops/action-gh-release@v3
        with:
          files: "*.pdf"
