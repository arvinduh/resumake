name: Release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: arvinduh/resumake/setup@RSMK_VERSION
        with:
          version: "RSMK_VERSION"
      - run: rsmk build --out-dir .rsmk/dist
      - uses: softprops/action-gh-release@v3
        with:
          files: ".rsmk/dist/*.pdf"
