name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish release assets for.
        required: true
        type: string

permissions:
  contents: write

env:
  # Tag name to operate on: the dispatch input for a manual run, otherwise the
  # pushed tag. Used both as the checkout ref and as the release tag_name so a
  # manual run can backfill assets onto an already-published tag.
  RELEASE_TAG:
    ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
    github.ref_name }}

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Generate release changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if:
      startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch'
    steps:
      - name: Download changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Create release with changelog body
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: CHANGELOG.md
          body_path: CHANGELOG.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schema:
    name: Publish canonical JSON Schema
    needs: [create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if:
      startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate schema from the models
        run: cargo run --release --example generate-schema

      - name: Upload schema release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: resume.schema.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build Binary (${{ matrix.target }})
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if:
      startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: rsmk
            asset_name: resumake-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: rsmk
            asset_name: resumake-aarch64-apple-darwin.tar.gz
          # Intel macOS is cross-compiled from the Apple Silicon runner: the
          # macos-13 Intel runner no longer schedules (see #6). The Xcode
          # toolchain on macos-latest targets x86_64 natively and
          # dtolnay/rust-toolchain installs the target from this matrix entry.
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: rsmk
            asset_name: resumake-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: rsmk.exe
            asset_name: resumake-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux/macOS archive
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.asset_name }} \
            -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}

      - name: Package Windows archive
        if: runner.os == 'Windows'
        run: |
          $tgt = "${{ matrix.target }}"
          $bin = "${{ matrix.binary_name }}"
          $binPath = "target/$tgt/release/$bin"
          Compress-Archive `
            -Path $binPath `
            -DestinationPath ${{ matrix.asset_name }}

      - name: Generate SHA-256 Checksum
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 ${{ matrix.asset_name }} > \
              ${{ matrix.asset_name }}.sha256
          else
            sha256sum ${{ matrix.asset_name }} > \
              ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
