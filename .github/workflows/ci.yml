name: CI Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  FORCE_COLOR: "1"
  # Pinned deliberately: `latest` silently re-floats the whole lint gate onto
  # a new formatter fleet the moment upstream tags a release.
  FML_VERSION: v0.2.1

jobs:
  lint:
    name: Formality Polyglot Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Node (for Prettier & Markdownlint)
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install Formality (fml)
        run: |
          FML_URL="https://github.com/arvinduh/formality/releases/download/${FML_VERSION}/fml-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$FML_URL" | tar -xz
          sudo mv fml /usr/local/bin/
          fml --version

      - name: Install missing surface toolchains
        run: fml install

      - name: Check polyglot formatting (fml fmt)
        run: fml fmt --check

      - name: Run polyglot linters (fml lint)
        run: fml lint

  security-audit:
    name: Security Audit (cargo audit)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Setup Typst compiler
        uses: typst-community/setup-typst@v5

      - name: Run test suite
        run: cargo test --all-targets

      - name: Build documentation
        run: cargo doc --no-deps
