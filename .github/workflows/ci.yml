name: CI Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Formality Polyglot Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Formality (fml)
        run: |
          FML_URL="https://github.com/arvinduh/formality/releases/latest/download/fml-x86_64-unknown-linux-gnu.tar.xz"
          tmp=$(mktemp -d)
          curl -fsSL "$FML_URL" | tar -xJ --strip-components=1 -C "$tmp"
          sudo mv "$tmp/fml" /usr/local/bin/
          rm -rf "$tmp"
          fml --version

      # fml runs these but does not install them. Pinned, unlike fml: their
      # output changes between versions and we don't control their releases.
      - name: Install surface toolchains
        run: |
          npm install -g @taplo/cli@0.7.0 markdownlint-cli2@0.24.0 \
            prettier@3.9.10
          pipx install yamllint==1.38.0

      - name: Check polyglot formatting (fml fmt)
        run: fml fmt --check

      - name: Run polyglot linters (fml lint)
        run: fml lint

  security-audit:
    name: Security Audit (cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install prebuilt cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  test:
    name: Test on ubuntu-latest
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --all-targets

      - name: Build documentation
        run: cargo doc --no-deps
