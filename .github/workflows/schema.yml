name: Schema Release

on:
  push:
    tags:
      - "s*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  schema:
    name: Publish Schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate schema from the models
        run: cargo run --release --example generate-schema

      - name: Publish schema release
        uses: softprops/action-gh-release@v3
        with:
          files: resume.schema.json
          make_latest: false
          body: |
            Canonical JSON Schema (Draft-07) for Resumake documents.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
