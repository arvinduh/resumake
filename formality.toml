#:schema https://github.com/arvinduh/formality/releases/download/s1.1/formality.schema.json

[global]
languages = ["rust", "typst", "markdown", "yaml", "toml", "json"]
indent_size = 2
line_length = 80
end_of_line = "lf"
charset = "utf-8"
insert_final_newline = true
trim_trailing_whitespace = true
use_tabs = false

[lang.markdown]
prose_wrap = "always"

[lang.json]
# resume.schema.json is generated by `cargo run --example generate-schema`
# (serde_json::to_string_pretty, which always expands arrays); its exact byte
# format is pinned by the drift test in src/schema.rs. fml's JSON formatter
# collapses short arrays and would fight that test, so this file is excluded
# from the json surface.
exclude = ["resume.schema.json"]
